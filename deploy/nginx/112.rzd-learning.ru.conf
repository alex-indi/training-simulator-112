server {

    server_name 112.rzd-learning.ru;

    # One shared gate for the SPA, REST API, Socket.IO and health endpoint.
    # Create this file on the server; never store credentials in Git.
    auth_basic "UT112 training stand";
    auth_basic_user_file /etc/nginx/ut112.htpasswd;

    root /home/alex/projects/training-simulator-112/frontend/dist;
    index index.html;

    # REST API backend.
    location /api/ {
        proxy_pass http://127.0.0.1:8112;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Socket.IO: HTTP polling + WebSocket.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8112;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Backend liveness.
    location = /health {
        proxy_pass http://127.0.0.1:8112/health;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/112.rzd-learning.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/112.rzd-learning.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

} 
server {
    if ($host = 112.rzd-learning.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


   listen 80;
    listen [::]:80;

    server_name 112.rzd-learning.ru;
    return 404; # managed by Certbot


}
