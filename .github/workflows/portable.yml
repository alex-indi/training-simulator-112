name: Portable offline ZIPs

on:
  workflow_dispatch:
  push:
    branches:
      - codex/portable-offline-demo
    paths:
      - .github/workflows/portable.yml
      - backend/**
      - frontend/**
      - scripts/build_portable.py
      - scripts/smoke_portable.py

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: Build portable archive
        run: python scripts/build_portable.py --target ${{ matrix.target }}
      - name: Smoke test extracted archive
        shell: bash
        run: |
          python scripts/smoke_portable.py dist/UT112-${{ matrix.target }}.zip > smoke-portable.log 2>&1
          status=$?
          cat smoke-portable.log
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-log-${{ matrix.target }}
          path: smoke-portable.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: UT112-${{ matrix.target }}
          path: dist/UT112-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 30
