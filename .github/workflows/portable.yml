name: Portable offline ZIPs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/portable-*
    tags:
      - 'v*'
    paths:
      - .github/workflows/portable.yml
      - backend/**
      - frontend/**
      - scripts/build_portable.py
      - scripts/smoke_portable.py

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: Build portable archive
        run: python scripts/build_portable.py --target ${{ matrix.target }}
      - name: Smoke test extracted archive
        shell: bash
        run: |
          set +e
          python scripts/smoke_portable.py dist/UT112-${{ matrix.target }}.zip > smoke-portable.log 2>&1
          status=$?
          cat smoke-portable.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          output = Path("smoke-portable.log").read_text(encoding="utf-8", errors="replace")[-2200:]
          output = output.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Portable smoke failed::{output}")
          PY
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-log-${{ matrix.target }}
          path: smoke-portable.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: UT112-${{ matrix.target }}
          path: dist/UT112-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download portable archives
        uses: actions/download-artifact@v4
        with:
          pattern: UT112-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for target in windows-x64 macos-x64 macos-arm64; do
            test -s "release-assets/UT112-${target}.zip"
          done
          gh release create "$GITHUB_REF_NAME" \
            release-assets/UT112-windows-x64.zip \
            release-assets/UT112-macos-x64.zip \
            release-assets/UT112-macos-arm64.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Портативные офлайн-сборки Учебного тренажёра 112 для Windows и macOS." \
            --verify-tag
